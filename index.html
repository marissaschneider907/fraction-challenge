<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fraction Challenge!</title><style>body{font-family:system-ui,sans-serif;background:#f3f6fc;color:#17243d;margin:0;padding:24px}main{max-width:760px;margin:auto;background:white;border-radius:20px;padding:28px;box-shadow:0 10px 30px #14233a18}h1{color:#2349a2}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button{padding:20px;font-size:1.3rem;border:2px solid #a9bce4;background:#eef3ff;border-radius:12px;cursor:pointer}.answers button:hover{background:#dce8ff}button:disabled{opacity:.65;cursor:default}.next{background:#2349a2;color:white;border:0;border-radius:10px;padding:14px 25px;font-size:1rem;cursor:pointer}.visual{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.bar{display:flex;width:240px;height:40px;border:2px solid #34466c}.part{flex:1;border-right:1px solid #34466c}.filled{background:#53b7a7}.feedback{font-size:1.15rem;font-weight:700;min-height:34px}.muted{color:#53627c}.hidden{display:none}input{font-size:1rem;padding:10px;border-radius:8px;border:1px solid #9eaed0}label{display:block;margin:12px 0}</style></head><body><main><h1>🎯 Fraction Challenge!</h1><p class="muted">7th Grade Math · Compare, order, and reason about fractions</p><section id="start"><p>Ready to practice? You can play individually or with a partner.</p><label>First name or team name (optional): <input id="player" maxlength="40"></label><button class="next" onclick="begin()">Start challenge</button></section><section id="game" class="hidden"><p id="progress" class="muted"></p><h2 id="question"></h2><div id="visual" class="visual"></div><div id="answers" class="answers"></div><p id="feedback" class="feedback" aria-live="polite"></p><button id="next" class="next hidden" onclick="advance()">Next question →</button></section><section id="end" class="hidden"><h2 id="result"></h2><p id="review"></p><button class="next" onclick="restart()">Play again</button></section></main><script>const questions=[{q:'Which fraction is shown by the shaded bar?',parts:4,fill:3,a:['1/4','2/4','3/4','4/4'],correct:2,why:'Three of four equal parts are shaded: 3/4.'},{q:'Which fraction is equivalent to 1/2?',parts:6,fill:3,a:['1/3','2/3','3/6','1/6'],correct:2,why:'Three of six equal parts is one half.'},{q:'Which fraction is greater?',a:['1/4','3/4','They are equal','Not enough information'],correct:1,why:'With the same denominator, the larger numerator gives the larger fraction.'},{q:'Which fraction is less than 1/2?',a:['3/4','2/3','2/5','4/6'],correct:2,why:'2/5 = 0.4, which is less than 0.5.'},{q:'Which pair of fractions is equivalent?',a:['2/3 and 4/6','1/2 and 1/3','3/4 and 3/8','2/5 and 3/5'],correct:0,why:'Multiplying the numerator and denominator of 2/3 by 2 gives 4/6.'},{q:'Which list is ordered from least to greatest?',a:['3/4, 1/2, 1/4','1/4, 1/2, 3/4','1/2, 1/4, 3/4','3/4, 1/4, 1/2'],correct:1,why:'One fourth is less than one half, which is less than three fourths.'},{q:'Which fraction is greatest?',a:['2/3','3/5','1/2','3/8'],correct:0,why:'2/3 ≈ 0.667, greater than 0.6, 0.5, and 0.375.'},{q:'You share 3/4 of a fish rack and your partner shares 2/3. Who has the larger share?',a:['You: 3/4','Partner: 2/3','Equal shares','Cannot compare'],correct:0,why:'3/4 = 9/12 and 2/3 = 8/12, so 3/4 is greater.'},{q:'Order these from least to greatest: 2/3, 1/2, 3/4.',a:['2/3, 1/2, 3/4','1/2, 2/3, 3/4','3/4, 2/3, 1/2','1/2, 3/4, 2/3'],correct:1,why:'Using twelfths: 6/12 < 8/12 < 9/12.'},{q:'Which fraction is between 1/2 and 3/4?',a:['1/4','2/5','5/8','7/8'],correct:2,why:'5/8 = 0.625, between 0.5 and 0.75.'}];let i=0,score=0,missed=[];function begin(){document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');render()}function render(){let q=questions[i];document.getElementById('progress').textContent=`Question ${i+1} of ${questions.length} · Score ${score}`;document.getElementById('question').textContent=q.q;document.getElementById('feedback').textContent='';document.getElementById('next').classList.add('hidden');let v=document.getElementById('visual');v.innerHTML='';if(q.parts){let b=document.createElement('div');b.className='bar';b.setAttribute('aria-label',`${q.fill} of ${q.parts} equal parts shaded`);for(let j=0;j<q.parts;j++){let p=document.createElement('span');p.className='part'+(j<q.fill?' filled':'');b.append(p)}v.append(b)}let a=document.getElementById('answers');a.innerHTML='';q.a.forEach((t,k)=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>choose(k);a.append(b)})}function choose(k){let q=questions[i],right=k===q.correct;if(right)score++;else missed.push(i+1);document.querySelectorAll('#answers button').forEach((b,j)=>{b.disabled=true;if(j===q.correct)b.style.background='#c9f2df';else if(j===k&&!right)b.style.background='#ffe1df'});document.getElementById('feedback').textContent=(right?'✅ Correct! ':'🔎 Keep learning! ')+q.why;document.getElementById('next').classList.remove('hidden');document.getElementById('next').textContent=i===questions.length-1?'See results →':'Next question →'}function advance(){i++;if(i<questions.length)render();else{document.getElementById('game').classList.add('hidden');document.getElementById('end').classList.remove('hidden');let name=document.getElementById('player').value.trim();document.getElementById('result').textContent=`${name?name+', ':''}you scored ${score}/${questions.length}!`;document.getElementById('review').textContent=missed.length?'Review questions: '+missed.join(', ')+'. Try again to improve!':'Excellent! You answered every question correctly.'}}function restart(){i=0;score=0;missed=[];document.getElementById('end').classList.add('hidden');document.getElementById('game').classList.remove('hidden');render()}</script></body></html>
